name: "Release: Build & Publish APK"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-apk:
    name: Build Release APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Expo prebuild (Android)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # ── Signing ──────────────────────────────────────────────────
      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/app/release.keystore

      - name: Configure signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        working-directory: mobile/android
        run: |
          cat >> gradle.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      # ── Build ────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Rename APK with version
        run: |
          APK_PATH=$(find mobile/android -name "*.apk" -path "*/release/*" | head -1)
          if [ -n "$APK_PATH" ]; then
            mv "$APK_PATH" "crypto-shop-${{ steps.version.outputs.tag }}.apk"
          else
            # Fallback to debug if release signing not configured
            APK_PATH=$(find mobile/android -name "*.apk" | head -1)
            mv "$APK_PATH" "crypto-shop-${{ steps.version.outputs.tag }}.apk"
          fi

      # ── Release ──────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CryptoShop Wallet ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: crypto-shop-${{ steps.version.outputs.tag }}.apk
          body: |
            ## CryptoShop Wallet ${{ steps.version.outputs.tag }}

            ### Installation
            1. Download the APK file below
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK to install

            ### What's Changed
            See auto-generated release notes below.
